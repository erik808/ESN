runners:
  podSecurityContext:
    runAsNonRoot: true

  containers:
    - name: build
      image: your-image
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
stages:    
    - test

pytest:
  stage: test

  before_script:
    - yum -y install python3-pip
    - pip --version
    - pip install -r requirements.txt
    
  script: 
    - cd python
    - pytest -vs .